<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FUDE · Seguimiento de capacitación</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F5F7;--brand:#800020;--brand-h:#8B1E2F;--navy:#1B2A4A;--ink:#1E1E1E;--mut:#4B5563;--line:#767E8C;--soft:#E3E6EB;--r:18px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Poppins,system-ui,sans-serif}
h1,h2,h3{color:var(--navy);margin:0;line-height:1.2}
h1{font-size:1.75rem;font-weight:600}h2{font-size:1.1rem;font-weight:600}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px;border-radius:6px}
button,select,input{font:inherit}
.sr{position:absolute;left:-9999px}
/* layout */
.side{position:fixed;inset:0 auto 0 0;width:264px;background:#fff;padding:24px 16px;display:flex;flex-direction:column;gap:8px;z-index:20;box-shadow:1px 0 0 var(--soft);transition:transform .25s}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--navy);font-size:1.3rem}
.logo b{background:var(--brand);color:#fff;border-radius:12px;padding:4px 10px;letter-spacing:.5px}
.emp{margin:4px 0 20px;padding:12px 14px;border-radius:14px;background:var(--bg);font-size:.9rem;color:var(--mut)}
.emp strong{display:block;color:var(--navy);font-size:1rem}
.side a{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;color:var(--navy);text-decoration:none;font-weight:500;min-height:46px}
.side a:hover{background:var(--bg)}
.side a[aria-current=page]{background:var(--brand);color:#fff}
.side a span{width:20px;text-align:center}
main{margin-left:264px;padding:40px clamp(16px,4vw,48px) 64px;max-width:1240px}
.top{display:none;position:sticky;top:0;z-index:10;background:#fff;padding:10px 16px;align-items:center;gap:12px;box-shadow:0 1px 0 var(--soft)}
.burger{background:none;border:2px solid var(--navy);color:var(--navy);border-radius:10px;width:44px;height:44px;font-size:1.3rem;cursor:pointer}
@media(max-width:900px){.side{transform:translateX(-100%)}.side.open{transform:none;box-shadow:0 0 0 100vmax rgba(27,42,74,.45)}main{margin:0;padding-top:24px}.top{display:flex}}
/* ui */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:28px}
.head p{margin:4px 0 0;color:var(--mut)}
.card{background:#fff;border-radius:var(--r);padding:28px;box-shadow:0 1px 2px rgba(27,42,74,.06),0 8px 24px rgba(27,42,74,.04);margin-bottom:24px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px;margin-bottom:24px}
.grid4 .card{margin:0}
.kpi small{color:var(--mut);display:block;font-weight:500}
.kpi strong{display:block;font-size:2.6rem;font-weight:700;color:var(--navy);line-height:1.1;margin-top:6px}
.btn{background:var(--brand);color:#fff;border:0;border-radius:12px;padding:11px 20px;min-height:44px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--brand-h)}
.btn.sec{background:#fff;color:var(--brand);border:2px solid var(--brand)}
.btn.sec:hover{background:#fbeef1}
.bar{height:14px;background:var(--soft);border-radius:99px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.bar i{display:block;height:100%;background:var(--navy);border-radius:99px}
.row{display:grid;grid-template-columns:90px 1fr 70px;gap:14px;align-items:center;margin-top:14px}
.big{font-size:1.5rem;font-weight:700;color:var(--navy)}
.pill{display:inline-flex;gap:6px;align-items:center;padding:3px 12px;border-radius:99px;font-size:.85rem;font-weight:600;white-space:nowrap}
.pill.g{background:#ECEEF1;color:#4B5563}.pill.b{background:#E4E9F5;color:#1B2A4A}.pill.a{background:#FFF1CC;color:#7A4B00}.pill.r{background:#FDE7E7;color:#A4161A}.pill.v{background:#E3F4EA;color:#146C43}
.tools{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.tools input,.tools select,.f input,.f select{border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;min-height:44px;background:#fff;color:var(--ink)}
.tools input{flex:1;min-width:200px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th{text-align:left;font-size:.8rem;text-transform:uppercase;letter-spacing:.5px;color:var(--mut);padding:10px 12px;border-bottom:2px solid var(--soft)}
td{padding:12px;border-bottom:1px solid var(--soft)}
tbody tr.clk{cursor:pointer}tbody tr.clk:hover{background:#FAFAFB}
.lnk{background:none;border:0;color:var(--navy);font-weight:600;cursor:pointer;padding:6px 0;text-align:left;text-decoration:underline;text-underline-offset:3px}
.mini{display:flex;align-items:center;gap:10px;min-width:130px}.mini .bar{flex:1;height:10px}
.at{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--soft);flex-wrap:wrap}
.at:last-of-type{border:0}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.tabs button{border:1.5px solid var(--line);background:#fff;color:var(--navy);border-radius:99px;padding:8px 18px;min-height:44px;font-weight:500;cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.cs{display:grid;grid-template-columns:2fr 3fr;gap:20px;align-items:center;padding:18px 0;border-bottom:1px solid var(--soft)}
.cs:last-child{border:0}.cs p{margin:2px 0 0;color:var(--mut);font-size:.9rem}
@media(max-width:700px){.cs{grid-template-columns:1fr}}
dialog{border:0;border-radius:var(--r);padding:0;box-shadow:0 20px 60px rgba(27,42,74,.35);max-width:min(560px,94vw);width:100%}
dialog::backdrop{background:rgba(27,42,74,.5)}
dialog.drawer{margin:0 0 0 auto;height:100vh;max-height:none;border-radius:var(--r) 0 0 var(--r);max-width:min(440px,100vw)}
.pad{padding:28px}
.x{float:right;background:none;border:2px solid var(--line);border-radius:10px;width:40px;height:40px;cursor:pointer;font-size:1.1rem;color:var(--navy)}
.f{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.f label{display:block;font-weight:600;color:var(--navy);margin-bottom:6px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 22px;border-radius:14px;z-index:99;display:none}
dl{margin:18px 0}dt{color:var(--mut);font-size:.85rem;margin-top:14px}dd{margin:0;font-weight:500}
</style>
</head>
<body>
<div class="top"><button class="burger" id="bg" aria-label="Abrir menú" aria-expanded="false" aria-controls="sd">☰</button><div class="logo"><b>FUDE</b></div></div>
<nav class="side" id="sd" aria-label="Principal">
  <div class="logo"><b>FUDE</b> <small style="font-weight:400;font-size:.7rem">by Educativo</small></div>
  <div class="emp"><strong>Grupo Andina S.A.</strong>Admin de RRHH</div>
</nav>
<main id="m" tabindex="-1"></main>
<dialog id="dr" class="drawer" aria-labelledby="drt"><div class="pad" id="drb"></div></dialog>
<div class="toast" id="ts" role="status" aria-live="polite"></div>

<script>
const $=s=>document.querySelector(s);
const NAV=[['inicio','⌂','Inicio'],['equipo','👥','Equipo'],['cursos','📚','Cursos y rutas'],['certificados','🎓','Certificados'],['informes','📊','Informes']];
// [nombre, correo, área, curso, %, días sin conectar, atrasado, nivel, ruta]
const P=[
['Lucía Fernández','lucia.f@andina.com','Ventas','Negociación efectiva',100,2,0,3,'Ventas y Negocios'],
['Martín Gómez','martin.g@andina.com','Ventas','Ventas consultivas',64,3,0,2,'Ventas y Negocios'],
['Sofía Ramírez','sofia.r@andina.com','RRHH','Liderar equipos',38,22,0,2,'Liderazgo y RRHH'],
['Diego Acosta','diego.a@andina.com','Operaciones','Seguridad en planta',0,0,0,1,'Salud y Seguridad'],
['Camila Ortiz','camila.o@andina.com','Administración','Excel para gestión',82,1,0,2,'Administración'],
['Julián Pereyra','julian.p@andina.com','Operaciones','Seguridad en planta',45,9,1,1,'Salud y Seguridad'],
['Valentina Sosa','vale.s@andina.com','Administración','IA para oficina',100,4,0,3,'IA'],
['Nicolás Bravo','nico.b@andina.com','Ventas','Ventas consultivas',12,35,0,1,'Ventas y Negocios'],
['Agustina Ledesma','agus.l@andina.com','RRHH','Gestión del talento',71,2,0,2,'Liderazgo y RRHH'],
['Franco Molina','franco.m@andina.com','Operaciones','Primeros auxilios',0,0,0,1,'Salud y Seguridad'],
['Paula Herrera','paula.h@andina.com','Administración','IA para oficina',55,5,0,1,'IA'],
['Tomás Benítez','tomas.b@andina.com','Ventas','Negociación efectiva',90,1,0,3,'Ventas y Negocios']];
const CUR={'Administración':[['Excel para gestión',1,5,3,1],['Gestión documental',2,3,2,1]],'IA':[['IA para oficina',1,4,2,2],['Prompts avanzados',2,2,1,0]],'Liderazgo y RRHH':[['Liderar equipos',2,4,3,1],['Gestión del talento',3,3,2,0]],'Salud y Seguridad':[['Seguridad en planta',1,5,3,0],['Primeros auxilios',1,3,2,0]],'Ventas y Negocios':[['Ventas consultivas',2,5,3,0],['Negociación efectiva',3,4,1,3]]};
const CERT=[['Lucía Fernández','Negociación efectiva','12/10/2026'],['Valentina Sosa','IA para oficina','03/10/2026'],['Tomás Benítez','Ventas consultivas','21/09/2026'],['Camila Ortiz','Gestión documental','15/09/2026'],['Lucía Fernández','Ventas consultivas','02/09/2026']];
const INF=['Quincenal · 15/10/2026','Quincenal · 30/09/2026','Quincenal · 15/09/2026'];
const F={q:'',area:'',est:'',cur:'',um:15};
const ST={sin:['○','Sin iniciar','g'],cur:['▶','En curso','b'],ina:['⏸','Inactivo','a'],atr:['⚠','Atrasado','r'],fin:['✓','Terminó','v']};
const est=p=>p[4]==100?'fin':p[4]==0?'sin':p[6]?'atr':p[5]>=F.um?'ina':'cur';
const pill=(p)=>{const e=est(p),s=ST[e];return `<span class="pill ${s[2]}"><span aria-hidden="true">${s[0]}</span>${s[1]}${e=='ina'?` (hace ${p[5]} días)`:''}</span>`};
const bar=(v,l)=>`<div class="bar" role="img" aria-label="${l||v+'%'}"><i style="width:${v}%"></i></div>`;
const ini=(a,b)=>b?Math.round(a*100/b):0;

const V={
inicio(){
 const n=P.length,fin=P.filter(p=>est(p)=='fin').length,prog=Math.round(P.reduce((a,p)=>a+p[4],0)/n),act=P.filter(p=>p[5]<=30).length,cup=20;
 const niv=[1,2,3].map(l=>[l,P.filter(p=>p[7]==l).length]);
 const at=P.map((p,i)=>[p,i]).filter(([p])=>['ina','atr','sin'].includes(est(p))).slice(0,5);
 return `<div class="head"><div><h1>Hola, equipo de RRHH 👋</h1><p>Así viene la capacitación de Grupo Andina.</p></div></div>
 <section class="grid4" aria-label="Indicadores principales">
  <div class="card kpi"><small>Progreso general</small><strong>${prog}%</strong></div>
  <div class="card kpi"><small>Tasa de finalización</small><strong>${ini(fin,n)}%</strong></div>
  <div class="card kpi"><small>Activos (últimos 30 días)</small><strong>${act}</strong></div>
  <div class="card kpi"><small>Certificados emitidos</small><strong>${CERT.length}</strong></div></section>
 <section class="card"><h2>Uso de cupos</h2><p class="big" style="margin:12px 0">${n} de ${cup} <span style="font-size:1rem;font-weight:400;color:var(--mut)">personas inscriptas</span></p>${bar(ini(n,cup),`${n} de ${cup} cupos usados`)}<p style="color:var(--mut);margin:10px 0 0">${cup-n} lugares libres</p></section>
 <section class="card"><h2>Avance por nivel</h2>${niv.map(([l,c])=>`<div class="row"><span>Nivel ${l}</span>${bar(ini(c,n),`Nivel ${l}: ${c} personas`)}<strong class="big" style="font-size:1.1rem">${c}</strong></div>`).join('')}</section>
 <section class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><h2>Requieren atención</h2><div style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn sec" style="text-decoration:none;display:inline-flex;align-items:center" href="#equipo">Ver todos</a><button class="btn" id="rec">Enviar recordatorio</button></div></div>
 <div style="margin-top:8px">${at.map(([p,i])=>`<div class="at"><div><strong>${p[0]}</strong><div style="color:var(--mut);font-size:.9rem">${p[3]}</div></div>${pill(p)}</div>`).join('')}</div></section>`},
equipo(){
 const ar=[...new Set(P.map(p=>p[2]))],cu=[...new Set(P.map(p=>p[3]))];
 return `<div class="head"><div><h1>Equipo</h1><p>Hacé clic en una persona para ver su detalle.</p></div><div style="display:flex;gap:10px"><button class="btn sec" id="xc">Exportar CSV</button><button class="btn sec" id="xx">Exportar Excel</button></div></div>
 <div class="card"><div class="tools" role="search">
  <input id="q" type="search" placeholder="Buscar por nombre" aria-label="Buscar por nombre">
  <select id="fa" aria-label="Área"><option value="">Todas las áreas</option>${ar.map(a=>`<option>${a}</option>`).join('')}</select>
  <select id="fe" aria-label="Estado"><option value="">Todos los estados</option>${Object.entries(ST).map(([k,v])=>`<option value="${k}">${v[1]}</option>`).join('')}</select>
  <select id="fc" aria-label="Curso"><option value="">Todos los cursos</option>${cu.map(a=>`<option>${a}</option>`).join('')}</select>
  <select id="fu" aria-label="Días para considerar inactivo">${[7,15,30].map(d=>`<option value="${d}" ${d==F.um?'selected':''}>Inactivo: ${d} días</option>`).join('')}</select></div>
 <div class="tw"><table><thead><tr><th>Nombre</th><th>Correo</th><th>Área</th><th>Curso / ruta actual</th><th>Avance</th><th>Estado</th></tr></thead><tbody id="tb"></tbody></table></div></div>`},
cursos(){
 const r=window._r||'Administración',lv=window._l||0;
 const list=CUR[r].filter(c=>!lv||c[1]==lv);
 return `<div class="head"><div><h1>Cursos y rutas</h1><p>Inscriptos, en curso y terminados por curso.</p></div></div>
 <div class="tabs" role="group" aria-label="Ruta">${Object.keys(CUR).map(k=>`<button data-r="${k}" aria-pressed="${k==r}">${k}</button>`).join('')}</div>
 <div class="tabs" role="group" aria-label="Nivel">${[[0,'Todos los niveles'],[1,'Nivel 1'],[2,'Nivel 2'],[3,'Nivel 3']].map(([k,t])=>`<button data-l="${k}" aria-pressed="${k==lv}">${t}</button>`).join('')}</div>
 <div class="card">${list.length?list.map(([n,l,i,c,t])=>`<div class="cs"><div><strong>${n}</strong><p>Nivel ${l} · ${i} inscriptos</p></div><div><div style="display:flex;gap:18px;flex-wrap:wrap;margin-bottom:8px;font-size:.9rem"><span>En curso: <b>${c}</b></span><span>Terminaron: <b>${t}</b></span><span>Finalización: <b>${ini(t,i)}%</b></span></div>${bar(ini(t,i),`${ini(t,i)}% terminó`)}</div></div>`).join(''):'<p>No hay cursos en este nivel para la ruta.</p>'}</div>`},
certificados(){return `<div class="head"><div><h1>Certificados</h1><p>Todos los certificados emitidos.</p></div></div>
 <div class="card"><div class="tools"><input id="cq" type="search" placeholder="Buscar persona o curso" aria-label="Buscar"><select id="cf" aria-label="Filtrar por curso"><option value="">Todos los cursos</option>${[...new Set(CERT.map(c=>c[1]))].map(c=>`<option>${c}</option>`).join('')}</select></div>
 <div class="tw"><table><thead><tr><th>Persona</th><th>Curso</th><th>Fecha</th><th><span class="sr">Descarga</span></th></tr></thead><tbody id="ct"></tbody></table></div></div>`},
informes(){return `<div class="head"><div><h1>Informes</h1><p>Resumen automático por correo.</p></div></div>
 <section class="card"><h2>Configuración</h2><form class="f" id="fi" style="margin-top:16px"><div><label for="fr">Frecuencia</label><select id="fr"><option>Quincenal</option><option>Mensual</option></select></div><div style="flex:1;min-width:240px"><label for="dest">Destinatarios (separados por coma)</label><input id="dest" type="text" style="width:100%" value="rrhh@andina.com"></div><button class="btn" type="submit">Guardar</button></form></section>
 <section class="card"><h2>Informes anteriores</h2>${INF.map(i=>`<div class="at"><span>${i}</span><a class="btn sec" href="#informes" style="text-decoration:none" aria-label="Descargar PDF ${i}">Descargar PDF</a></div>`).join('')}</section>`}};

function toast(t){const e=$('#ts');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',3000)}
function rows(){
 const r=P.map((p,i)=>[p,i]).filter(([p])=>(!F.q||p[0].toLowerCase().includes(F.q.toLowerCase()))&&(!F.area||p[2]==F.area)&&(!F.est||est(p)==F.est)&&(!F.cur||p[3]==F.cur));
 $('#tb').innerHTML=r.length?r.map(([p,i])=>`<tr class="clk" data-i="${i}"><td><button class="lnk" data-i="${i}">${p[0]}</button></td><td>${p[1]}</td><td>${p[2]}</td><td>${p[3]}</td><td><div class="mini">${bar(p[4])}<b>${p[4]}%</b></div></td><td>${pill(p)}</td></tr>`).join(''):'<tr><td colspan="6">Sin resultados.</td></tr>';
 return r}
function drawer(i){const p=P[i],c=CERT.filter(x=>x[0]==p[0]);
 $('#drb').innerHTML=`<button class="x" data-close aria-label="Cerrar panel (Esc)">✕</button><h2 id="drt">${p[0]}</h2><div style="margin-top:8px">${pill(p)}</div>
 <dl><dt>Correo</dt><dd>${p[1]}</dd><dt>Área</dt><dd>${p[2]}</dd><dt>Última conexión</dt><dd>${p[5]==0&&p[4]==0?'Nunca ingresó':`Hace ${p[5]} días`}</dd><dt>Ruta y nivel</dt><dd>${p[8]} · Nivel ${p[7]}</dd><dt>Curso actual</dt><dd>${p[3]}<div class="mini" style="margin-top:6px">${bar(p[4])}<b>${p[4]}%</b></div></dd><dt>Certificados</dt><dd>${c.length?c.map(x=>x[1]).join(', '):'Todavía no tiene'}</dd></dl>`;
 $('#dr').showModal()}
function dl(name,mime,txt){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+txt],{type:mime}));a.download=name;a.click()}

function render(){
 const s=(location.hash.slice(1)||'inicio');const k=V[s]?s:'inicio';
 $('#sd').querySelectorAll('a').forEach(a=>a.remove());
 NAV.forEach(([id,ic,t])=>{const a=document.createElement('a');a.href='#'+id;a.innerHTML=`<span aria-hidden="true">${ic}</span>${t}`;if(id==k)a.setAttribute('aria-current','page');$('#sd').append(a)});
 $('#m').innerHTML=V[k]();$('#sd').classList.remove('open');$('#bg').setAttribute('aria-expanded','false');
 if(k=='inicio')$('#rec').onclick=()=>toast('Recordatorio enviado (simulado)');
 if(k=='equipo'){rows();
  const bind=(id,key,f=v=>v)=>$(id).oninput=e=>{F[key]=f(e.target.value);rows()};
  bind('#q','q');bind('#fa','area');bind('#fe','est');bind('#fc','cur');bind('#fu','um',Number);
  $('#tb').onclick=e=>{const t=e.target.closest('[data-i]');if(t)drawer(t.dataset.i)};
  const data=()=>rows().map(([p])=>[p[0],p[1],p[2],p[3],p[4]+'%',ST[est(p)][1]]);
  $('#xc').onclick=()=>dl('equipo.csv','text/csv',[['Nombre','Correo','Área','Curso','Avance','Estado'],...data()].map(r=>r.map(c=>`"${c}"`).join(',')).join('\n'));
  $('#xx').onclick=()=>dl('equipo.xls','application/vnd.ms-excel','<table>'+data().map(r=>'<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('')+'</table>')}
 if(k=='cursos')document.querySelectorAll('[data-r],[data-l]').forEach(b=>b.onclick=()=>{if(b.dataset.r)window._r=b.dataset.r;else window._l=+b.dataset.l;render();$('[aria-pressed=true]').focus()});
 if(k=='certificados'){const f=()=>{const q=$('#cq').value.toLowerCase(),c=$('#cf').value;$('#ct').innerHTML=CERT.filter(x=>(!c||x[1]==c)&&(!q||(x[0]+x[1]).toLowerCase().includes(q))).map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td><a class="btn sec" href="#certificados" aria-label="Descargar certificado de ${x[0]}, ${x[1]}" style="text-decoration:none">⬇ Descargar</a></td></tr>`).join('')||'<tr><td colspan="4">Sin resultados.</td></tr>'};$('#cq').oninput=f;$('#cf').onchange=f;f()}
 if(k=='informes')$('#fi').onsubmit=e=>{e.preventDefault();toast('Configuración guardada')};
}
document.addEventListener('click',e=>{if(e.target.closest('[data-close]'))e.target.closest('dialog').close();if(e.target.tagName=='DIALOG')e.target.close()});
$('#bg').onclick=()=>{const o=$('#sd').classList.toggle('open');$('#bg').setAttribute('aria-expanded',o)};
addEventListener('keydown',e=>{if(e.key=='Escape')$('#sd').classList.remove('open')});
addEventListener('hashchange',()=>{render();$('#m').focus()});
render();
</script>
</body>
</html>
